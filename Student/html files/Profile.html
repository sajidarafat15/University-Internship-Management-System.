<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css files/Student.css">
    <title>My Profile</title>
</head>
<body>

    <div class="sec-1">

        <!-- Left Navigation Bar -->
        <nav class="left-nav">
            <div class="brand">Intern<span>Ease</span></div>
            <a href="Student-Dashboard.html">DashBoard</a>
            <a href="Search-Job.html">Find Internships</a>
            <a href="Offer letter.html">Offer letters</a>
            <a href="Document_Submission.html">Submit Documents</a>
            <a href="Placement.html">My Internship</a>
            <a href="Progress-Report.html">Progress Reports</a>
            <a href="Login.html" class="logout" id="logoutLink">Logout</a>
        </nav>

        <section class="sec-1-sub">

            <!-- Top banner with profile icon -->
            <div class="image">
                <div class="banner-title">
                    <h1>My Profile</h1>
                    <p>View and update your personal details</p>
                </div>
                <a href="Profile.html" class="profile-icon" title="My Profile">S</a>
            </div>

            <div class="content">
                <div class="form-card">
                    <div class="profile-head">
                        <div class="profile-avatar-lg" id="profileAvatar">S</div>
                        <div>
                            <h2 style="margin:0">My Profile</h2>
                            <p class="result-count" style="margin:4px 0 0">Keep your details up to date for applications.</p>
                        </div>
                    </div>
                    <div class="success-msg" id="profileSuccess"></div>
                    <form id="profileForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="pName">Full Name</label>
                                <input type="text" id="pName" required minlength="3" data-pattern="^[A-Za-z .'-]+$" data-msg="Enter a valid name (letters only).">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="pId">Student ID</label>
                                <input type="text" id="pId" required data-pattern="^[0-9]{7,10}$" placeholder="e.g. 2022100123" data-msg="Student ID must be 7-10 digits.">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="pEmail">Email</label>
                                <input type="email" id="pEmail" required data-pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" data-msg="Enter a valid email address.">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="pPhone">Phone</label>
                                <input type="tel" id="pPhone" required data-pattern="^(\+8801|01)[3-9][0-9]{8}$" placeholder="01XXXXXXXXX" data-msg="Enter a valid Bangladeshi mobile number.">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="pDept">Department</label>
                                <select id="pDept" required data-msg="Please select your department.">
                                    <option value="">-- Select --</option>
                                    <option value="CSE">Computer Science and Engineering</option>
                                    <option value="EEE">Electrical and Electronic Engineering</option>
                                    <option value="IPE">Industrial and Production Engineering</option>
                                </select>
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="pCgpa">CGPA</label>
                                <input type="number" id="pCgpa" step="0.01" required data-min="0" data-max="4" data-msg="Enter your CGPA (0.00 - 4.00).">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group full">
                                <label for="pSkills">Skills</label>
                                <textarea id="pSkills" required minlength="3" placeholder="e.g. HTML, CSS, JavaScript" data-msg="List at least one skill."></textarea>
                                <span class="error-msg"></span>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Profile</button>
                        </div>
                    </form>
                </div>
            </div>

        </section>

    </div>

    <script src="../js files/student.js"></script>
</body>
</html>
