<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css files/Student.css">
    <title>Student Dashboard</title>
</head>
<body>

    <div class="sec-1">

        <!-- Left Navigation Bar -->
        <nav class="left-nav">
            <div class="brand">Intern<span>Ease</span></div>
            <a href="Student-Dashboard.html">DashBoard</a>
            <a href="Search-Job.html">Find Internships</a>
            <a href="Offer letter.html">Offer letters</a>
            <a href="Document_Submission.html">Submit Documents</a>
            <a href="Placement.html">My Internship</a>
            <a href="Progress-Report.html">Progress Reports</a>
            <a href="Login.html" class="logout" id="logoutLink">Logout</a>
        </nav>

        <section class="sec-1-sub">

            <!-- Top banner with profile icon -->
            <div class="image">
                <div class="banner-title">
                    <h1>Student Dashboard</h1>
                    <p>Overview of your internship applications</p>
                </div>
                <a href="Profile.html" class="profile-icon" title="My Profile">S</a>
            </div>

            <div class="content">
                <div class="sec-1-sub-1">

                    <div class="stat-card stat-pending">
                        <h1>Pending Applications</h1>
                        <p class="stat-number" id="countPending">0</p>
                    </div>

                    <div class="stat-card stat-rejected">
                        <h1>Rejected</h1>
                        <p class="stat-number" id="countRejected">0</p>
                    </div>

                    <div class="stat-card stat-accepted">
                        <h1>Accepted</h1>
                        <p class="stat-number" id="countAccepted">0</p>
                    </div>

                </div>

                <h2 class="section-title">Recent Applications</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Position</th><th>Company</th><th>Applied Date</th><th>Status</th></tr>
                        </thead>
                        <tbody id="recentBody"></tbody>
                    </table>
                </div>
            </div>

        </section>

    </div>

    <script src="../js files/student.js"></script>
</body>
</html>
