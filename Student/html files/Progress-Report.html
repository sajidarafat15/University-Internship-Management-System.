<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css files/Student.css">
    <title>Progress Reports</title>
</head>
<body>

    <div class="sec-1">

        <!-- Left Navigation Bar -->
        <nav class="left-nav">
            <div class="brand">Intern<span>Ease</span></div>
            <a href="Student-Dashboard.html">DashBoard</a>
            <a href="Search-Job.html">Find Internships</a>
            <a href="Offer letter.html">Offer letters</a>
            <a href="Document_Submission.html">Submit Documents</a>
            <a href="Placement.html">My Internship</a>
            <a href="Progress-Report.html">Progress Reports</a>
            <a href="Login.html" class="logout" id="logoutLink">Logout</a>
        </nav>

        <section class="sec-1-sub">

            <!-- Top banner with profile icon -->
            <div class="image">
                <div class="banner-title">
                    <h1>Progress Reports</h1>
                    <p>Submit your weekly internship progress</p>
                </div>
                <a href="Profile.html" class="profile-icon" title="My Profile">S</a>
            </div>

            <div class="content">
                <div class="form-card">
                    <div class="success-msg" id="reportSuccess"></div>
                    <form id="reportForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="repWeek">Week Number</label>
                                <input type="number" id="repWeek" required data-min="1" data-max="24" placeholder="e.g. 1" data-msg="Enter the week number.">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group">
                                <label for="repHours">Hours Worked</label>
                                <input type="number" id="repHours" required data-min="1" data-max="60" placeholder="e.g. 30" data-msg="Enter the hours worked.">
                                <span class="error-msg"></span>
                            </div>
                            <div class="form-group full">
                                <label for="repSummary">Work Summary</label>
                                <textarea id="repSummary" required minlength="30" maxlength="500" placeholder="Describe what you worked on this week (min 30 characters)" data-msg="Please write a summary of your work."></textarea>
                                <span class="error-msg"></span>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Submit Report</button>
                            <button type="reset" class="btn btn-details">Clear</button>
                        </div>
                    </form>
                </div>

                <h2 class="section-title">Submitted Reports</h2>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Week</th><th>Hours</th><th>Summary</th><th>Date</th><th>Status</th></tr></thead>
                        <tbody id="reportBody"></tbody>
                    </table>
                </div>
            </div>

        </section>

    </div>

    <script src="../js files/student.js"></script>
</body>
</html>
